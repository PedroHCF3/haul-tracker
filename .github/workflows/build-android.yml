name: Build Android APK

on:
  push:
    branches:
      - feature/product-images-variants
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Haul Tracker APK
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: https://hyvpmrycaqleiwjbctal.supabase.co
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_u-AdgPUQngrfvRHR4h-jfw_hquijGtm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web app for Android
        run: npm run build -- --base=./

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: haul-tracker-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
